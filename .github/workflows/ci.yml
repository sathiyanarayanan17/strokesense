name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (also downloads the MediaPipe models)
        run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # After the build: Next.js generates route types (e.g. LayoutProps) during the build.
      - run: npx tsc --noEmit
      - name: Upload build for the E2E job
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: End-to-end (headless Chrome, fake camera & mic)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Start production server
        run: |
          npx next start -p 3000 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
      - name: Run E2E smoke test
        run: npm run e2e
        env:
          BASE_URL: http://localhost:3000
          BROWSER: chrome
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore

  python:
    name: Python scoring port (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "python[dev]"
      - run: python -m pytest python

  eval:
    name: Synthetic robustness evaluation
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eval
      - name: Fail if the committed evaluation report is out of date
        run: git diff --exit-code docs/EVALUATION.md
